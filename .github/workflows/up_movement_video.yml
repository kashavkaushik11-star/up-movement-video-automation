name: UP Movement Video Test

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Subject for the cinematic reveal"
        required: false
        default: "a mysterious object revealed inside a human hand"
  schedule:
    - cron: "30 5 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: up-movement-video

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig && fc-cache -f -v

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate UP movement video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOPIC: ${{ github.event.inputs.topic || 'a mysterious object revealed inside a human hand' }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            echo "UP movement generation attempt $attempt/5"
            if node up_movement_video.js; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: up-movement-video
          path: output_up_movement/
          retention-days: 3
